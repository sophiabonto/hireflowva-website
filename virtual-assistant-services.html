document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

m; color: rgba(255,255,255,0.4)\" style-hover=\"color: #43E0D4\">Terms of Service<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240}}\">\nclass Component extends DCLogic {\n  state = { active: 0, openFaq: -1 };\n\n  roles() {\n    return [\n      {\n        title: \"Executive Assistant\", short: \"an executive assistant\", hours: \"Part-time or full-time\",\n        summary: \"The default first hire. An executive assistant guards your calendar and inbox so your attention goes to the work only you can do.\",\n        tasks: [\"Calendar ownership: scheduling, rescheduling, agendas\", \"Inbox triage — escalate what matters, file what doesn't\", \"Travel booking and itineraries\", \"Meeting prep, notes, and follow-up tracking\", \"Expense reports and reimbursements\"],\n        tools: [\"Google Workspace\", \"Microsoft 365\", \"Calendly\", \"Slack\", \"Notion\"],\n        firstWeek: \"Shadowing your calendar and inbox, documenting your preferences and escalation rules, then taking over scheduling by day four.\"\n      },\n      {\n        title: \"Administrative VA\", short: \"an administrative VA\", hours: \"Part-time or full-time\",\n        summary: \"The broad entry point. If you know your week is full of small recurring tasks but not which role you need, start here — an administrative assistant absorbs the general load and grows into a specialization.\",\n        tasks: [\"Data entry, file organization, and document prep\", \"Email and phone coverage\", \"Scheduling and appointment reminders\", \"Research, list building, and form filling\", \"CRM and spreadsheet updates\"],\n        tools: [\"Google Workspace\", \"Microsoft 365\", \"Dropbox\", \"Slack\", \"Zoom\"],\n        firstWeek: \"Listing every recurring task you handle yourself, then taking the top five off your plate with a documented process for each.\"\n      },\n      {\n        title: \"Operations VA\", short: \"an operations VA\", hours: \"Part-time or full-time\",\n        summary: \"For the founder who is the bottleneck on every process. An operations assistant keeps projects, vendors, and documentation moving without you chasing them.\",\n        tasks: [\"Project tracking and status updates\", \"Writing and maintaining SOPs\", \"Vendor and contractor coordination\", \"Recurring reporting and dashboards\", \"Internal task follow-up and reminders\"],\n        tools: [\"Asana\", \"Trello\", \"Notion\", \"Slack\", \"Google Sheets\"],\n        firstWeek: \"Auditing your active projects, building one shared tracker, and documenting the two processes you repeat most often.\"\n      },\n      {\n        title: \"Marketing VA\", short: \"a marketing VA\", hours: \"Part-time or full-time\",\n        summary: \"Runs the marketing admin behind your campaigns — email sends, newsletters, list hygiene, and the coordination that keeps a calendar on schedule.\",\n        tasks: [\"Email campaign setup, testing, and sending\", \"Newsletter production and scheduling\", \"CRM list segmentation and data hygiene\", \"Landing page and form updates\", \"Campaign reporting and basic marketing coordination\"],\n        tools: [\"Mailchimp\", \"HubSpot\", \"Klaviyo\", \"Canva\", \"Google Analytics\"],\n        firstWeek: \"Auditing your lists and templates, then building and sending the first campaign under your review.\"\n      },\n      {\n        title: \"Marketing Coordinator VA\", short: \"a marketing coordinator VA\", hours: \"Full-time typical\",\n        summary: \"A higher-skill hire that combines social, email, content, and project coordination in one person — for teams that need marketing run, not just supported.\",\n        tasks: [\"Owning the marketing calendar across channels\", \"Coordinating writers, designers, and freelancers\", \"Email, social, and content production end to end\", \"Campaign briefs, timelines, and launch checklists\", \"Cross-channel performance reporting\"],\n        tools: [\"HubSpot\", \"Asana\", \"Canva\", \"Notion\", \"Google Analytics\", \"Buffer\"],\n        firstWeek: \"Consolidating every in-flight campaign into one calendar, then presenting a 90-day plan with owners and dates.\"\n      },\n      {\n        title: \"Social Media VA\", short: \"a social media VA\", hours: \"Part-time typical\",\n        summary: \"Keeps the content engine running on schedule — planning, publishing, and reporting, so your channels don't go quiet in busy weeks.\",\n        tasks: [\"Content calendar planning and scheduling\", \"Publishing across platforms\", \"Comment and DM engagement\", \"Basic graphics and template updates\", \"Monthly performance reporting\"],\n        tools: [\"Canva\", \"Meta Business Suite\", \"Later\", \"Google Sheets\", \"Notion\"],\n        firstWeek: \"Building a four-week content calendar from your existing posts, then scheduling the first two weeks for your review.\"\n      },\n      {\n        title: \"Content VA\", short: \"a content VA\", hours: \"Part-time typical\",\n        summary: \"Turns your ideas and recordings into published work — drafts, newsletters, and repurposed posts on a predictable schedule.\",\n        tasks: [\"Blog and newsletter drafting\", \"Editing and proofreading\", \"Repurposing long-form into posts\", \"On-page SEO basics and internal linking\", \"Publishing and formatting in your CMS\"],\n        tools: [\"Google Docs\", \"WordPress\", \"Grammarly\", \"Surfer SEO\", \"ChatGPT\"],\n        firstWeek: \"Studying your voice from past pieces, building an outline bank, and delivering the first draft for feedback.\"\n      },\n      {\n        title: \"Lead Generation VA\", short: \"a lead generation VA\", hours: \"Part-time or full-time\",\n        summary: \"Fills the top of the funnel. A lead generation assistant builds the lists, researches the accounts, and runs the outreach so your pipeline never starts from zero.\",\n        tasks: [\"Prospect list building to your ICP criteria\", \"Lead research and contact verification\", \"Cold email and LinkedIn outreach sequences\", \"Database building and deduplication\", \"Response tracking and handoff to sales\"],\n        tools: [\"LinkedIn Sales Navigator\", \"Apollo\", \"HubSpot\", \"Instantly\", \"Google Sheets\"],\n        firstWeek: \"Defining your ideal-customer criteria with you, then delivering the first verified prospect list for approval.\"\n      },\n      {\n        title: \"Sales VA\", short: \"a sales VA\", hours: \"Part-time or full-time\",\n        summary: \"Keeps the pipeline honest and the calendar full. A sales assistant handles the follow-up and admin that reps skip when they are selling.\",\n        tasks: [\"CRM follow-up and next-step reminders\", \"Appointment setting and confirmations\", \"Pipeline hygiene and stage updates\", \"Proposal and quote preparation\", \"Weekly pipeline and activity reporting\"],\n        tools: [\"HubSpot\", \"Salesforce\", \"Pipedrive\", \"Calendly\", \"Zoom\"],\n        firstWeek: \"Cleaning up stale deals, setting follow-up cadences per stage, and booking the first week of meetings.\"\n      },\n      {\n        title: \"Customer Support VA\", short: \"a customer support VA\", hours: \"Full-time typical\",\n        summary: \"First-line coverage for your inbox, chat, and phone, with escalation rules you set — so customers get answers without you writing them.\",\n        tasks: [\"Ticket and live chat response\", \"Inbound and outbound calls\", \"Knowledge base and macro upkeep\", \"Refunds, returns, and account changes\", \"Weekly volume and theme reporting\"],\n        tools: [\"Zendesk\", \"Intercom\", \"HubSpot\", \"Slack\", \"Google Workspace\"],\n        firstWeek: \"Learning your top 20 recurring questions, drafting macros for each, and handling tier-one tickets under review by day five.\"\n      },\n      {\n        title: \"Recruiting VA\", short: \"a recruiting VA\", hours: \"Part-time or full-time\",\n        summary: \"Runs your hiring pipeline the way we run ours — sourcing, first-pass screening, and scheduling, so you only spend time on finalists.\",\n        tasks: [\"Sourcing candidates against your role profile\", \"Resume screening and shortlisting\", \"Initial screening calls and note-taking\", \"Interview scheduling and coordination\", \"Applicant tracking and candidate follow-up\"],\n        tools: [\"LinkedIn Recruiter\", \"Greenhouse\", \"Indeed\", \"Calendly\", \"Google Workspace\"],\n        firstWeek: \"Building the role profile and screening rubric with you, then delivering a first shortlist for review.\"\n      },\n      {\n        title: \"Bookkeeping VA\", short: \"a bookkeeping VA\", hours: \"Part-time typical\",\n        summary: \"Keeps the books current instead of a quarterly scramble — invoicing, categorization, reconciliation, and reporting on a fixed rhythm.\",\n        tasks: [\"Invoicing and payment follow-up\", \"Expense categorization and receipt capture\", \"Bank and card reconciliation\", \"Accounts payable scheduling\", \"Monthly P&L and cash reporting\"],\n        tools: [\"QuickBooks\", \"Xero\", \"Expensify\", \"Ramp\", \"Google Sheets\"],\n        firstWeek: \"Reconciling the current month, flagging anything uncategorized, and setting a weekly close checklist with you.\"\n      },\n      {\n        title: \"Real Estate VA\", short: \"a real estate VA\", hours: \"Part-time or full-time\",\n        summary: \"Keeps deals and leads moving between showings. A real estate assistant handles the paperwork and follow-up that otherwise waits until evening.\",\n        tasks: [\"Transaction coordination from contract to close\", \"MLS listing entry, updates, and photo uploads\", \"Lead follow-up and CRM pipeline hygiene\", \"Showing and open house scheduling\", \"Comps, market research, and listing presentations\"],\n        tools: [\"MLS\", \"Follow Up Boss\", \"kvCORE\", \"DocuSign\", \"Dotloop\", \"Canva\"],\n        firstWeek: \"Learning your contract checklist and CRM stages, then taking over listing updates and new-lead follow-up by day four.\"\n      },\n      {\n        title: \"Property Management VA\", short: \"a property management VA\", hours: \"Part-time or full-time\",\n        summary: \"Handles the day-to-day of a portfolio: tenant messages, maintenance calls, vacancy listings, and the paperwork behind all of it.\",\n        tasks: [\"Tenant communication and inquiry response\", \"Maintenance request intake and vendor coordination\", \"Vacancy listings and applicant screening\", \"Lease paperwork, renewals, and notices\", \"Rent tracking and owner reporting\"],\n        tools: [\"AppFolio\", \"Buildium\", \"Zillow Rental Manager\", \"DocuSign\", \"Google Workspace\"],\n        firstWeek: \"Taking over the tenant inbox, logging open maintenance items, and setting a vendor contact sheet with response times.\"\n      },\n      {\n        title: \"eCommerce VA\", short: \"an eCommerce VA\", hours: \"Part-time or full-time\",\n        summary: \"Runs the day-to-day of the storefront: listings, orders, and the customer messages that come with them.\",\n        tasks: [\"Product listings and catalog updates\", \"Order processing and fulfillment tracking\", \"Returns, refunds, and exchanges\", \"Inventory monitoring and reorder flags\", \"Marketplace customer messages\"],\n        tools: [\"Shopify\", \"Amazon Seller Central\", \"Gorgias\", \"Google Sheets\", \"Canva\"],\n        firstWeek: \"Cleaning up your listing data, taking over order processing, and setting a daily inventory flag report.\"\n      },\n      {\n        title: \"Custom Role\", short: \"a custom-matched VA\", hours: \"Scoped with you\",\n        summary: \"For roles that don't fit a template. We scope the responsibilities with you, then build the search and skills test around them.\",\n        tasks: [\"Role scoping call and written job profile\", \"Custom skills test for your workflow\", \"Targeted sourcing against your criteria\", \"3–5 shortlisted candidates with video intros\", \"Interviews scheduled back to back\"],\n        tools: [\"Your stack — confirmed before sourcing\"],\n        firstWeek: \"Whatever you scoped. We write the 30-day plan with you before the assistant starts.\"\n      }\n    ];\n  }\n\n  renderVals() {\n    const list = this.roles();\n    const activeIndex = Math.min(this.state.active, list.length - 1);\n\n    const roleList = list.map((r, i) => {\n      const on = i === activeIndex;\n      return {\n        title: r.title,\n        num: String(i + 1).padStart(2, \"0\"),\n        bar: on ? \"#00A899\" : \"rgba(13,31,60,0.16)\",\n        bg: on ? \"#0D1F3C\" : \"#fff\",\n        color: on ? \"#fff\" : \"#435870\",\n        numColor: on ? \"#43E0D4\" : \"#5A6E82\",\n        weight: on ? \"700\" : \"500\",\n        select: () => this.setState({ active: i })\n      };\n    });\n\n    const faqSource = [\n      { q: \"Do you take a cut of my assistant's pay?\", a: \"No. You pay one placement fee, then pay your assistant directly at the rate you agree with them. We never mark up their salary or hold a margin on their hours.\" },\n      { q: \"How are candidates vetted?\", a: \"Screening, a skills test built around your actual role, a recorded video introduction, and reference checks. Every candidate you meet has already completed a test assignment.\" },\n      { q: \"What if the hire doesn't work out?\", a: \"Placements include a 30-day fit guarantee. If it isn't right, we rematch you with no additional placement fee.\" },\n      { q: \"Will they work my hours?\", a: \"Time zone overlap is part of the matching criteria. We confirm your working hours during the discovery call and only present candidates whose availability fits.\" }\n    ];\n\n    const faqs = faqSource.map((f, i) => {\n      const open = this.state.openFaq === i;\n      return {\n        q: f.q, a: f.a, open,\n        icon: open ? \"×\" : \"+\",\n        border: open ? \"#00C2B5\" : \"rgba(0,0,0,0.08)\",\n        iconBg: open ? \"#00A899\" : \"#E6FAF9\",\n        iconColor: open ? \"#fff\" : \"#008F84\",\n        color: open ? \"#008F84\" : \"#0D1F3C\",\n        toggle: () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i }))\n      };\n    });\n\n    return {\n      roleList,\n      active: list[activeIndex],\n      faqs,\n      supports: [\n        { icon: \"✉️\", title: \"Inbox Management\", desc: \"Your assistant works in your inbox — escalating what matters, filing what doesn't, and drafting the routine replies.\" },\n        { icon: \"📅\", title: \"Calendar Management\", desc: \"Scheduling, rescheduling, agendas, and travel, with your preferences and buffers documented.\" },\n        { icon: \"📊\", title: \"Workflow Management\", desc: \"Tasks tracked, deadlines chased, and reminders sent so nothing sits waiting on you.\" },\n        { icon: \"🤝\", title: \"Sales Support\", desc: \"CRM hygiene, follow-up sequences, appointment setting, and proposal prep for your pipeline.\" },\n        { icon: \"🗂️\", title: \"Data Entry & Reporting\", desc: \"Recurring reports, list building, CRM updates, and the cleanup nobody on your team wants.\" },\n        { icon: \"📣\", title: \"Marketing Admin\", desc: \"Social calendars scheduled, templates updated, newsletters sent, and content published on time.\" }\n      ],\n      model: [\n        { label: \"What you pay us\", value: \"One placement fee per hire, lower per hire as you add roles.\" },\n        { label: \"What you pay them\", value: \"Directly, at the rate you and your assistant agree on.\" },\n        { label: \"Who manages them\", value: \"You do. We stay available for check-ins at 30, 60, and 90 days.\" },\n        { label: \"Optional extras\", value: \"Academy training ($250 one-time) and Ongoing Education ($75/mo).\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
